<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 470" width="690" height="470" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="690" height="470" fill="#ffffff"/>

  <text x="345" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1e2a5a">Burndown del release (puntos pendientes)</text>

  <!-- Cuadrícula y eje Y: y(v) = 340 - 4v -->
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="60" x2="600" y2="60"/>
    <line x1="80" y1="100" x2="600" y2="100"/>
    <line x1="80" y1="140" x2="600" y2="140"/>
    <line x1="80" y1="180" x2="600" y2="180"/>
    <line x1="80" y1="220" x2="600" y2="220"/>
    <line x1="80" y1="260" x2="600" y2="260"/>
    <line x1="80" y1="300" x2="600" y2="300"/>
  </g>
  <line x1="80" y1="340" x2="600" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="80" y1="50" x2="80" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <g font-size="12" fill="#374151" text-anchor="end">
    <text x="72" y="344">0</text>
    <text x="72" y="304">10</text>
    <text x="72" y="264">20</text>
    <text x="72" y="224">30</text>
    <text x="72" y="184">40</text>
    <text x="72" y="144">50</text>
    <text x="72" y="104">60</text>
    <text x="72" y="64">70</text>
  </g>
  <text x="30" y="200" font-size="12" fill="#374151" text-anchor="middle" transform="rotate(-90 30 200)">Puntos pendientes</text>

  <!-- Eje X por fecha: x(d) = 90 + 9.26 d, d = días desde el 14/10 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="90" y1="340" x2="90" y2="345"/>
    <line x1="219.6" y1="340" x2="219.6" y2="345"/>
    <line x1="349.3" y1="340" x2="349.3" y2="345"/>
    <line x1="478.9" y1="340" x2="478.9" y2="345"/>
    <line x1="590" y1="340" x2="590" y2="345"/>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="90" y="360">14/10</text>
    <text x="90" y="375" fill="#6b7280">Inicio</text>
    <text x="219.6" y="360">28/10</text>
    <text x="219.6" y="375" fill="#6b7280">Cierre Sprint 1</text>
    <text x="349.3" y="360">11/11</text>
    <text x="349.3" y="375" fill="#6b7280">Review Sprint 1</text>
    <text x="478.9" y="360">25/11</text>
    <text x="478.9" y="375" fill="#6b7280">Review Sprint 2</text>
    <text x="590" y="360">07/12</text>
    <text x="590" y="375" fill="#6b7280">Sprint 4 (plan)</text>
  </g>

  <!-- Review del Sprint 2, 25/11 (d = 42) -->
  <line x1="478.9" y1="50" x2="478.9" y2="340" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Semana de cierre y entrega final, 02/12 (d = 49) -->
  <rect x="478.9" y="50" width="64.8" height="290" fill="#059669" fill-opacity="0.06"/>
  <line x1="543.7" y1="50" x2="543.7" y2="340" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="549" y="62" font-size="12" font-weight="600" fill="#059669">Entrega final</text>
  <text x="549" y="77" font-size="12" font-weight="600" fill="#059669">02/12</text>
  <text x="511.3" y="105" font-size="11" fill="#059669" text-anchor="middle">Cierre</text>

  <!-- Ideal: plan original de cuatro Sprints -->
  <polyline points="90,76 219.6,152 349.3,216 478.9,288 590,340" fill="none" stroke="#4a5a85" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#4a5a85">
    <circle cx="90" cy="76" r="5"/>
    <circle cx="219.6" cy="152" r="5"/>
    <circle cx="349.3" cy="216" r="5"/>
    <circle cx="478.9" cy="288" r="5"/>
    <circle cx="590" cy="340" r="5"/>
  </g>
  <g font-size="12" fill="#4a5a85" font-weight="600">
    <text x="349.3" y="236" text-anchor="middle">31</text>
    <text x="478.9" y="308" text-anchor="middle">13</text>
    <text x="590" y="330" text-anchor="middle">0</text>
  </g>

  <!-- Real: 66 (14/10), 47 (28/10), 42 (11/11), 34 (19/11), 29 (25/11), 29 (02/12) -->
  <polyline points="90,76 219.6,152 349.3,172 423.4,204 478.9,224" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="478.9,224 543.7,224" fill="none" stroke="#e8a33d" stroke-width="3" stroke-dasharray="6 5"/>
  <g fill="#e8a33d">
    <circle cx="90" cy="76" r="5"/>
    <circle cx="219.6" cy="152" r="5"/>
    <circle cx="349.3" cy="172" r="5"/>
    <circle cx="423.4" cy="204" r="5"/>
    <circle cx="478.9" cy="224" r="5"/>
  </g>
  <g font-size="12" font-weight="600" fill="#b7791f">
    <text x="90" y="66" text-anchor="middle">66</text>
    <text x="219.6" y="140" text-anchor="middle">47</text>
    <text x="349.3" y="160" text-anchor="middle">42</text>
    <text x="423.4" y="192" text-anchor="middle">34</text>
    <text x="478.9" y="212" text-anchor="middle">29</text>
    <text x="543.7" y="212" text-anchor="middle">29</text>
  </g>
  <circle cx="543.7" cy="224" r="5" fill="#ffffff" stroke="#e8a33d" stroke-width="2.5"/>
  <text x="423.4" y="178" font-size="10" fill="#6b7280" text-anchor="middle">HU-05</text>

  <!-- Anotación -->
  <text x="290" y="120" font-size="11" fill="#6b7280" text-anchor="middle">Refinamiento sin Sprint</text>
  <text x="290" y="134" font-size="11" fill="#6b7280" text-anchor="middle">y HU-10 retirada (−5)</text>

  <!-- Leyenda -->
  <g font-size="13" fill="#1f2937">
    <line x1="110" y1="410" x2="140" y2="410" stroke="#4a5a85" stroke-width="3"/>
    <circle cx="125" cy="410" r="5" fill="#4a5a85"/>
    <text x="148" y="414">Ideal (plan original, 4 Sprints)</text>
    <line x1="380" y1="410" x2="410" y2="410" stroke="#e8a33d" stroke-width="3"/>
    <circle cx="395" cy="410" r="5" fill="#e8a33d"/>
    <text x="418" y="414">Real (Sprints 1 y 2)</text>
  </g>
  <text x="345" y="444" font-size="11" fill="#6b7280" text-anchor="middle">Los puntos reales bajan solo al terminar historias con la DoD.</text>
  <text x="345" y="460" font-size="11" fill="#6b7280" text-anchor="middle">Tramo punteado: previsto para la semana de cierre (26/11–02/12), que no suma historias.</text>
</svg>
